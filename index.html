<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cờ Cá Ngựa Mèo Chibi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
/* ===== Góc camera (đăng ký kiểu <angle> để animate mượt) ===== */
@property --rx{syntax:'<angle>';inherits:true;initial-value:55deg}
@property --rz{syntax:'<angle>';inherits:true;initial-value:45deg}
:root{--glass:rgba(255,255,255,.55);--glass-b:rgba(255,255,255,.85);--ink:#5a3b63}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Baloo 2','Nunito','Segoe UI',system-ui,sans-serif;color:var(--ink);overflow:hidden;
  background:radial-gradient(circle at 15% 10%,#fff6c9 0,transparent 40%),radial-gradient(circle at 85% 15%,#c9ecff 0,transparent 42%),radial-gradient(circle at 50% 100%,#ffd3ea 0,transparent 50%),linear-gradient(120deg,#fff3e0,#ffe1f0,#dff1ff,#e3ffe9,#fff3e0);background-size:100% 100%,100% 100%,100% 100%,400% 400%;animation:bgmove 26s ease infinite}
@keyframes bgmove{0%{background-position:0 0,0 0,0 0,0 50%}50%{background-position:0 0,0 0,0 0,100% 50%}100%{background-position:0 0,0 0,0 0,0 50%}}
canvas#bg,canvas#fx{position:fixed;inset:0;pointer-events:none}
canvas#bg{z-index:0}canvas#fx{z-index:90}
button{font-family:inherit}

/* ===== Kính mờ (Glassmorphism) ===== */
.glass,.panel{background:var(--glass);backdrop-filter:blur(14px) saturate(1.5);-webkit-backdrop-filter:blur(14px) saturate(1.5);border:2px solid var(--glass-b);box-shadow:0 12px 32px rgba(190,90,160,.18),inset 0 1px 0 #fff}

/* ===== Nút ===== */
#tools{position:fixed;top:10px;right:12px;z-index:60;display:flex;gap:8px;align-items:center}
.chip{background:rgba(255,255,255,.88);border:0;border-radius:999px;padding:7px 14px;font:inherit;font-weight:700;color:var(--ink);box-shadow:0 3px 0 rgba(255,126,182,.45);cursor:pointer}
.chip:active{transform:translateY(2px)}
.ingame-only{display:none}body.ingame .ingame-only{display:inline-block}
.btn{border:0;font:inherit;font-weight:800;font-size:18px;color:#fff;padding:11px 26px;border-radius:999px;cursor:pointer;position:relative;overflow:hidden;
  background:linear-gradient(#ff9ccb,#ff5c9d);box-shadow:0 5px 0 #d93a85,0 10px 18px rgba(255,92,157,.3);transition:.12s}
.btn::after{content:'';position:absolute;left:10%;right:10%;top:3px;height:42%;border-radius:999px;background:linear-gradient(rgba(255,255,255,.55),transparent)}
.btn:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 #d93a85}
.btn.alt{background:linear-gradient(#8fd8ff,#47a8ff);box-shadow:0 5px 0 #2a7ccc,0 10px 18px rgba(71,168,255,.3)}
.btn.gold{background:linear-gradient(#ffe36e,#ffb800);color:#7a4a00;box-shadow:0 5px 0 #d99000,0 10px 18px rgba(255,184,0,.3)}
.btn.green{background:linear-gradient(#9cf0a8,#35c75a);box-shadow:0 5px 0 #1f9a3f,0 10px 18px rgba(53,199,90,.3)}
.btn:disabled{filter:grayscale(.8);opacity:.55;cursor:not-allowed}

/* ===== Màn hình ===== */
.screen{display:none;height:100%;position:relative;z-index:2}
.screen.active{display:block}
#menu.active,#lobby.active{overflow:auto}
.center{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:70px 16px 30px;text-align:center}
.center h1{font-size:clamp(30px,6vw,58px);line-height:1.05;background:linear-gradient(90deg,#ff5c9d,#ffa63d,#47a8ff,#5fd37a);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 rgba(255,255,255,.95))}
.sub{font-size:18px;font-weight:700;opacity:.8}
.col{display:flex;flex-direction:column;gap:14px;align-items:stretch;min-width:min(320px,90vw);margin-top:6px}
.joinrow{display:flex;gap:8px}
.joinrow input,.seat input.nm,#wName{font:inherit;font-weight:700;border:3px solid #ffc2dc;border-radius:999px;padding:8px 16px;background:#fff;color:var(--ink);outline:none;min-width:0;flex:1;text-align:center}
.joinrow input{text-transform:uppercase;letter-spacing:3px}
details.rules{padding:10px 18px;border-radius:20px;max-width:560px;text-align:left;font-weight:600}
details.rules summary{cursor:pointer;font-weight:800;text-align:center}
details.rules li{margin:5px 0 5px 18px}
#logoCats{display:flex;gap:6px;align-items:flex-end;height:116px}
#logoCats svg{width:82px;filter:drop-shadow(0 8px 6px rgba(120,40,120,.25))}
@keyframes bob{50%{transform:translateY(-4px)}}

/* ===== Phòng chờ ===== */
.wrap{max-width:1100px;margin:0 auto;padding:64px 14px 30px;display:flex;flex-direction:column;gap:14px;align-items:center}
.roombox{display:flex;gap:14px;align-items:center;padding:10px 20px;border-radius:24px;flex-wrap:wrap;justify-content:center}
.code{font-size:40px;font-weight:800;letter-spacing:8px;color:#ff5c9d}
.seats{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;width:100%}
.seat{border-radius:26px;padding:12px;border:4px solid var(--c);display:flex;flex-direction:column;gap:8px;background:rgba(255,255,255,.7);box-shadow:0 8px 0 rgba(0,0,0,.06),0 0 22px color-mix(in srgb,var(--c) 40%,transparent)}
.seat.dim{opacity:.6}
.seat .sh{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.seat .sh b{flex:1;min-width:90px}
.tag{background:#ffe6f1;border-radius:999px;padding:2px 10px;font-size:13px;font-weight:800}
.seat select{font:inherit;font-weight:700;border-radius:999px;border:2px solid #ffc2dc;padding:3px 8px;background:#fff;color:var(--ink)}
.seat .prev{width:104px;height:130px;margin:0 auto}
.seat .prev svg{width:100%;height:100%;filter:drop-shadow(0 6px 5px rgba(120,40,120,.25))}
.seat .ph{font-size:48px;text-align:center;padding:30px 0}
.seat input.nm{text-align:left;width:100%}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:center}

/* ===== Tủ đồ / Phòng thay đồ – phong cách Art Toy / Blind-box, pastel + kính mờ ===== */
#ward{position:fixed;inset:0;z-index:70;display:none;align-items:center;justify-content:center;padding:12px;backdrop-filter:blur(10px);
  background:radial-gradient(circle at 15% 15%,rgba(255,205,235,.75),transparent 50%),radial-gradient(circle at 85% 85%,rgba(210,195,255,.75),transparent 50%),radial-gradient(circle at 80% 10%,rgba(255,244,205,.6),transparent 40%),rgba(150,100,190,.32)}
#ward.show{display:flex}
.wbox{width:min(1020px,100%);max-height:100%;overflow:auto;display:grid;grid-template-columns:320px 1fr;gap:20px;padding:18px;border-radius:36px;animation:cardIn .5s cubic-bezier(.2,1.3,.4,1);
  background:linear-gradient(145deg,rgba(255,247,252,.8),rgba(238,228,255,.7) 55%,rgba(255,242,230,.7));border:2px solid #fff;
  box-shadow:0 0 0 3px rgba(255,175,222,.5),0 0 44px rgba(210,150,255,.55),0 24px 60px rgba(110,50,150,.35),inset 0 2px 0 #fff}
@media(max-width:780px){.wbox{grid-template-columns:1fr}}
.wleft{display:flex;flex-direction:column;align-items:center;gap:12px}
/* Hộp trưng bày trong suốt (collector box) */
.cbox{position:relative;width:100%;perspective:900px}
.cbox-glass{--ty:0deg;--tx:0deg;position:relative;aspect-ratio:1/1.22;border-radius:34px;overflow:hidden;cursor:pointer;transform-style:preserve-3d;transform:rotateY(var(--ty)) rotateX(var(--tx));transition:transform .18s ease-out;
  background:linear-gradient(165deg,rgba(255,255,255,.7),rgba(255,214,240,.4) 45%,rgba(214,200,255,.5));
  border:4px solid rgba(255,255,255,.95);
  box-shadow:0 0 0 4px rgba(255,190,228,.6),0 22px 44px rgba(150,80,190,.38),inset 0 0 46px rgba(255,255,255,.75),inset 0 -24px 44px rgba(200,150,255,.3)}
.cbox-stage{position:absolute;inset:0;background:radial-gradient(circle at 50% 38%,#fff 0,#ffeaf6 40%,#ffd3ea 75%,#e9d3ff 100%)}
.cbox-stage::before{content:'🐾  🐾  🐾';position:absolute;left:0;right:0;top:20%;text-align:center;font-size:22px;opacity:.12;letter-spacing:34px;white-space:nowrap}
.cbox-top{position:absolute;top:10px;left:0;right:0;text-align:center;z-index:3;font-weight:800;font-size:12px;letter-spacing:4px;color:#b57acb;text-shadow:0 1px 0 #fff}
.sp{position:absolute;z-index:3;color:#ffcf3a;text-shadow:0 0 8px #fff,0 0 12px #ffd23f;animation:twinkle 2.2s infinite;pointer-events:none;font-style:normal}
.sp.s1{top:12%;left:9%;font-size:20px}.sp.s2{top:20%;right:10%;font-size:15px;animation-delay:.7s}.sp.s3{top:46%;left:6%;font-size:13px;animation-delay:1.2s;color:#ff8fc9}.sp.s4{top:40%;right:6%;font-size:18px;animation-delay:.3s;color:#b48cff}.sp.s5{top:7%;left:46%;font-size:12px;animation-delay:1.6s}
@keyframes twinkle{50%{opacity:.25;transform:scale(.8)}}
.pedestal{position:absolute;bottom:17%;left:11%;right:11%;height:13%;border-radius:50%;background:radial-gradient(ellipse at 50% 25%,#fff,#ffd9f0 55%,#dcc2ff);box-shadow:0 12px 20px rgba(160,80,190,.38),inset 0 -5px 8px rgba(160,80,180,.25),0 0 0 3px rgba(255,255,255,.8)}
#wPrev{position:absolute;left:15%;width:70%;bottom:20%;z-index:2;animation:bob 2.4s ease-in-out infinite;filter:drop-shadow(0 14px 8px rgba(120,40,140,.32)) drop-shadow(0 0 16px rgba(255,255,255,.55))}
#wPrev svg{width:100%;display:block}
.refl{position:absolute;pointer-events:none;z-index:4}
.refl.r1{top:-10%;left:-35%;width:42%;height:130%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.6),transparent);transform:rotate(16deg);animation:sheen 5.5s ease-in-out infinite}
.refl.r2{top:-10%;left:-35%;width:10%;height:130%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.7),transparent);transform:rotate(16deg);animation:sheen 5.5s ease-in-out .25s infinite}
@keyframes sheen{0%{left:-45%}55%,100%{left:125%}}
.refl.r3{inset:6px;border-radius:28px;border:2px solid rgba(255,255,255,.55);border-right-color:transparent;border-bottom-color:transparent}
.cbox-badge{position:absolute;left:10px;right:10px;bottom:9px;z-index:5;border-radius:16px;padding:5px 10px 6px;text-align:center;color:#7a4a00;line-height:1.05;
  background:linear-gradient(180deg,#fff7c4,#ffd84a 45%,#e7a600);border:2px solid #fff8d2;box-shadow:0 3px 0 #b87800,0 8px 16px rgba(200,140,0,.4),inset 0 2px 0 rgba(255,255,255,.8)}
.cbox-badge b{display:block;font-size:15px;letter-spacing:2.5px}
.cbox-badge span{display:inline-block;margin-top:2px;font-size:10px;font-weight:800;letter-spacing:2px;padding:1px 9px;border-radius:999px;background:#7a4a00;color:#ffe9a0}
.wright{display:flex;flex-direction:column;gap:12px;min-width:0}
.wright h3{font-size:24px;background:linear-gradient(90deg,#ff5c9d,#b48cff);-webkit-background-clip:text;background-clip:text;color:transparent}
.wtabs{display:flex;gap:8px;flex-wrap:wrap}
.wtabs button{border:2px solid rgba(255,255,255,.95);border-radius:999px;padding:8px 16px;font-weight:800;color:var(--ink);cursor:pointer;background:rgba(255,255,255,.55);backdrop-filter:blur(8px);
  box-shadow:0 0 0 2px rgba(255,190,228,.5),0 4px 10px rgba(170,100,190,.18);transition:.15s}
.wtabs button:hover{transform:translateY(-2px);box-shadow:0 0 0 2px rgba(255,150,210,.8),0 8px 16px rgba(170,100,190,.28)}
.wtabs button.on{color:#fff;background:linear-gradient(135deg,#ff9ccb,#c59bff);box-shadow:0 0 0 2px #fff,0 0 18px 3px rgba(255,130,210,.7),0 5px 0 #c35a9d}
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:12px;perspective:700px;padding:4px}
.wgrid button{border-radius:20px;border:2px solid #fff;background:linear-gradient(160deg,rgba(255,255,255,.95),rgba(255,230,246,.75) 60%,rgba(232,220,255,.8));cursor:pointer;padding:5px 3px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative;
  box-shadow:0 6px 0 rgba(222,170,215,.6),0 12px 18px rgba(170,100,190,.2),inset 0 2px 0 #fff;transition:transform .18s cubic-bezier(.3,1.5,.5,1),box-shadow .18s}
.wgrid button:hover{transform:translateY(-6px) rotateX(10deg) scale(1.05);box-shadow:0 12px 0 rgba(222,170,215,.55),0 20px 26px rgba(170,100,190,.3),inset 0 2px 0 #fff}
.wgrid button.sel{transform:translateY(-5px) scale(1.04);background:linear-gradient(160deg,#fff,#ffd9ee 60%,#e4d2ff);
  box-shadow:0 0 0 3px #ff8cc8,0 0 20px 5px rgba(255,120,200,.65),0 9px 0 #e07db3,inset 0 2px 0 #fff}
.wgrid button.sel::after{content:'✔';position:absolute;top:-8px;right:-6px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;color:#fff;background:linear-gradient(#ff9ccb,#ff5c9d);box-shadow:0 0 0 2px #fff,0 0 10px #ff8cc8}
.wgrid button svg{width:100%;height:66px;display:block;filter:drop-shadow(0 3px 2px rgba(120,40,140,.25))}
.wgrid button svg *{animation:none!important}
.wgrid button small{font-size:11px;font-weight:800;text-align:center;color:#8a5a99;line-height:1.1;min-height:24px;display:grid;place-items:center}
#wName{background:rgba(255,255,255,.75);border-color:#ffd0ea;box-shadow:0 0 0 2px rgba(255,255,255,.9),0 4px 12px rgba(170,100,190,.2);width:100%}
.wbox .btn{outline:2px solid rgba(255,255,255,.85);outline-offset:-2px}
.pal{display:flex;flex-wrap:wrap;gap:7px;align-items:center}
.pal button{width:32px;height:32px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px #e0c6d8;cursor:pointer;position:relative}
.pal button.sel{box-shadow:0 0 0 3px #ff5c9d}
.pal button.taken{opacity:.25;cursor:not-allowed}.pal button.taken::after{content:'✕';position:absolute;inset:0;display:grid;place-items:center;font-size:14px;font-weight:800;color:#5a3b63}
.pal input[type=color]{width:38px;height:34px;border:0;background:none;cursor:pointer}
.wlabel{font-weight:800;font-size:14px;opacity:.75}

/* ===== Màn chơi ===== */
#game{padding:54px 12px 10px}
#game.active{display:grid;grid-template-columns:230px 1fr 250px;gap:12px}
@media(max-width:960px){#game.active{grid-template-columns:1fr;grid-template-rows:auto minmax(420px,60vh) auto;overflow:auto;height:100%}}
.panel{border-radius:26px;padding:12px;display:flex;flex-direction:column;gap:8px;overflow:auto}
.pl{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:18px;border:3px solid transparent;background:rgba(255,255,255,.6)}
.pl svg{width:42px;height:52px;flex:none}
.pl .nm{font-weight:800;line-height:1.1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl small{font-weight:700;opacity:.75;display:block}
.pl .dot{width:12px;height:12px;border-radius:50%;flex:none}
.pl.cur{border-color:#ffd23f;background:#fffbe0;animation:pulse 1.3s infinite}
@keyframes pulse{50%{box-shadow:0 0 14px #ffd23f}}
.pl .nm.ed{cursor:pointer}.pl .nm.ed:hover{text-decoration:underline dotted}
#stage{position:relative;overflow:hidden;border-radius:30px;min-height:380px;touch-action:none;cursor:grab;
  background:radial-gradient(circle at 50% 45%,rgba(255,255,255,.55),rgba(255,255,255,.12));border:2px solid rgba(255,255,255,.75);box-shadow:inset 0 0 40px rgba(255,255,255,.5),0 10px 30px rgba(190,90,160,.15)}
#stage:active{cursor:grabbing}
#stage.shake{animation:sshake .45s}
@keyframes sshake{20%{transform:translate(-6px,3px)}40%{transform:translate(6px,-3px)}60%{transform:translate(-4px,2px)}80%{transform:translate(3px,-1px)}}
#scene{position:absolute;left:50%;top:50%;width:600px;height:600px;margin:-300px 0 0 -300px;perspective:1700px;transition:transform .8s ease}
#scene.drag{transition:none}
#board{position:relative;width:600px;height:600px;transform-style:preserve-3d;transform:rotateX(var(--rx)) rotateZ(var(--rz));transition:--rx .9s ease,--rz .9s ease}
#board.drag{transition:none}
.camctl{position:absolute;right:10px;bottom:10px;display:flex;gap:6px;z-index:5}
.camctl button{width:42px;height:42px;border-radius:50%;border:0;font-size:20px;font-weight:800;color:var(--ink);cursor:pointer;background:rgba(255,255,255,.9);box-shadow:0 3px 0 rgba(255,126,182,.5)}
.camctl button:active{transform:translateY(2px)}
.camhint{position:absolute;left:12px;bottom:10px;font-size:12px;font-weight:700;opacity:.6;pointer-events:none}
.bshadow{position:absolute;inset:-26px;border-radius:70px;background:rgba(90,30,120,.4);filter:blur(26px);transform:translateZ(-80px)}
.slab{position:absolute;inset:-18px;border-radius:44px}
.slab.top{background:linear-gradient(135deg,#fffdf6,#ffeaf5);border:7px solid #fff;box-shadow:0 0 0 3px #ffc2dc,inset 0 0 30px rgba(255,170,210,.35)}
.cage{position:absolute;width:240px;height:240px;border-radius:34px;background:linear-gradient(145deg,color-mix(in srgb,var(--cc) 80%,#fff),var(--cc));transform:translateZ(1px);box-shadow:inset 0 -8px 0 rgba(0,0,0,.14),0 0 0 3px #fff,0 0 22px color-mix(in srgb,var(--cc) 70%,transparent)}
.cage i{position:absolute;inset:22px;border-radius:26px;background:rgba(255,255,255,.86);box-shadow:inset 0 4px 10px rgba(0,0,0,.1)}
.cage svg{position:absolute;inset:0;width:100%;height:100%;animation:pawGlow 2.6s ease-in-out infinite alternate}
@keyframes pawGlow{from{filter:drop-shadow(0 0 2px var(--cc))}to{filter:drop-shadow(0 0 9px var(--cc)) brightness(1.1)}}

/* Ô cờ: viền dày + phát sáng nhẹ để tách rõ từng ô */
.tile{position:absolute;width:36px;height:36px;border-radius:10px;display:grid;place-items:center;transform:translateZ(2px);color:#fff;font-weight:800;font-size:16px;text-shadow:0 2px 0 rgba(0,0,0,.25);
  background:linear-gradient(160deg,color-mix(in srgb,var(--tc) 55%,#fff),var(--tc));border:3px solid #fff;
  box-shadow:0 0 0 2px var(--edge,#d9a7c8),0 0 9px var(--edge,#d9a7c8),inset 0 -4px 0 rgba(0,0,0,.12),inset 0 3px 0 rgba(255,255,255,.7)}
.tico{position:absolute;inset:1px;transform:rotateZ(calc(var(--rz) * -1));pointer-events:none}
.tico svg{width:100%;height:100%;display:block;filter:drop-shadow(0 0 3px var(--g,#fff));animation:ico 2.2s ease-in-out infinite}
@keyframes ico{50%{transform:translateY(-1.5px) scale(1.07)}}
.tico svg.spin{animation:spin 3s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.tico svg .sparks{animation:twinkle .9s infinite}
.tile.sp{background:radial-gradient(circle at 50% 40%,#fff 0,color-mix(in srgb,var(--g) 38%,#fff) 78%);box-shadow:0 0 0 2px var(--g),0 0 10px 2px var(--g),inset 0 -4px 0 rgba(0,0,0,.1);animation:tg 1.9s ease-in-out infinite}
@keyframes tg{50%{box-shadow:0 0 0 2px var(--g),0 0 20px 7px var(--g),inset 0 -4px 0 rgba(0,0,0,.1)}}
.tile.flash{animation:flash .7s}
@keyframes flash{40%{transform:translateZ(10px) scale(1.25);box-shadow:0 0 26px 10px #fff}}
.tile.corner{background:radial-gradient(circle at 50% 40%,#fff 0,#fff3b8 80%);box-shadow:0 0 0 2px #ffcf3a,0 0 10px 2px #ffcf3a,inset 0 -4px 0 rgba(0,0,0,.1)}
.tile.goal{transform:translateZ(6px);width:40px;height:40px;margin:-2px 0 0 -2px;font-size:19px;box-shadow:0 0 0 3px #ffd23f,0 0 0 6px #fff,0 0 18px 6px #ffd23f,inset 0 -4px 0 rgba(0,0,0,.18);animation:startGlow 1.6s ease-in-out infinite;--sc:#ffd23f}
.tile.start{width:44px;height:44px;margin:-4px 0 0 -4px;border-radius:13px;transform:translateZ(3px);
  box-shadow:0 0 0 3px var(--sc),0 0 0 6px #fff,inset 0 -4px 0 rgba(0,0,0,.2);animation:startGlow 1.6s ease-in-out infinite}
@keyframes startGlow{50%{box-shadow:0 0 0 3px var(--sc),0 0 0 6px #fff,0 0 20px 9px var(--sc),inset 0 -4px 0 rgba(0,0,0,.2)}}
.trophy{position:absolute;left:300px;top:300px;width:0;height:0;transform-style:preserve-3d;transform:translateZ(10px);pointer-events:none}
.tbill{position:absolute;width:54px;height:43px;left:-27px;top:-43px;transform-origin:50% 94%;transform-style:preserve-3d;transform:rotateZ(calc(var(--rz) * -1)) rotateX(calc(var(--rx) * -1))}
.tfloat{position:absolute;inset:0;transform-style:preserve-3d;animation:tfloat 2.6s ease-in-out infinite;transform-origin:50% 90%}
@keyframes tfloat{50%{transform:translateY(-3px)}}
.pedestal3d{position:absolute;left:278px;top:278px;width:44px;height:44px;transform:translateZ(8px);pointer-events:none;
  clip-path:polygon(30% 0,70% 0,100% 30%,100% 70%,70% 100%,30% 100%,0 70%,0 30%);
  background:conic-gradient(from 20deg,#e8f6ff,#9fd6ff 18%,#f4fbff 30%,#7fb4ee 50%,#eaf7ff 66%,#a5c8ff 82%,#e8f6ff);
  box-shadow:inset 0 0 0 3px #d9a21a}

<script>
/* =====================================================================
   CỜ CÁ NGỰA MÈO CHIBI – bản 3D Isometric, tủ đồ thời trang, xoay camera
   1) ENGINE luật chơi   2) Ngôn ngữ   3) Âm thanh   4) Mèo SVG + tủ đồ dữ liệu
   5) Bàn cờ 2.5D & camera   6) Hiệu ứng   7) Điều khiển ván   8) Lobby/Online/Tủ đồ
   ===================================================================== */

//#ENGINE_START
/* ---------- 1. ENGINE: luật chơi thuần logic (không đụng DOM) ---------- */
// Vòng đua 56 ô (14 ô mỗi cánh, có ô góc ở mỗi khúc cua). Ô 0 của mỗi ghế nằm ở RÌA bàn cờ.
const RING=(()=>{const r=[];
  for(let x=0;x<=5;x++)r.push([x,6]);r.push([6,6]);
  for(let y=5;y>=0;y--)r.push([6,y]);r.push([7,0]);
  for(let y=0;y<=5;y++)r.push([8,y]);r.push([8,6]);
  for(let x=9;x<=14;x++)r.push([x,6]);r.push([14,7]);
  for(let x=14;x>=9;x--)r.push([x,8]);r.push([8,8]);
  for(let y=9;y<=14;y++)r.push([8,y]);r.push([7,14]);
  for(let y=14;y>=9;y--)r.push([6,y]);r.push([6,8]);
  for(let x=5;x>=0;x--)r.push([x,8]);r.push([0,7]);
  return r;})();
const RL=RING.length;                          // 56 ô vòng đua
const FIN=RL+5;                                // ô đích cuối (6 ô chuồng đích: RL..FIN)
const START=[0,14,28,42];                      // ô xuất phát của 4 ghế
const rot90=([x,y])=>[14-y,x];
const rotPt=([x,y])=>[15-y,x];
const HOME=[0,1,2,3].map(k=>{let c=[1,2,3,4,5,6].map(x=>[x,7]);for(let i=0;i<k;i++)c=c.map(rot90);return c;});
const CAGE=[0,1,2,3].map(k=>{let s=[[2,2],[4,2],[2,4],[4,4]],c=[3,3];for(let i=0;i<k;i++){s=s.map(rotPt);c=rotPt(c);}return{slots:s,c};});
// Ô đặc biệt (đã giảm bớt): mỗi cánh có 1 ô giáp, 1 thẻ bài, và 1 ô tốc độ hoặc bẫy lùi (xen kẽ). Ô xuất phát KHÔNG có quà/bẫy.
const ringType=i=>{const m=i%14,q=Math.floor(i/14);return m===0?'start':m===6?'corner':m===4?'shield':m===9?'mystery':m===12?(q%2?'back':'speed'):'normal';};
const ringIdx=(o,p)=>(START[o]+p)%RL;          // bước p (0..RL-1) của ghế o -> chỉ số ô vòng đua
const CARDS=[{id:'fwd5',good:1},{id:'revive',good:1},{id:'coins',good:1},{id:'skip',good:0},{id:'reset',good:0},{id:'freeze',good:0}];

/* Trạng thái: p=-1 chuồng, 0..RL-1 vòng đua, RL..FIN chuồng đích (FIN=đích, xếp chồng được) */
function newGame(cfg){
  const seats=cfg.map(s=>({on:s.type==='human'||s.type==='bot',type:s.type==='bot'?'bot':'human',name:s.name,color:s.color,cloth:s.cloth,ccol:s.ccol,hat:s.hat,face:s.face,neck:s.neck,score:0,skip:0}));
  const pieces=[];for(let o=0;o<4;o++)for(let i=0;i<4;i++)pieces.push({id:o*4+i,o,p:-1,sh:false,fz:0});
  return{seats,pieces,turn:seats.findIndex(s=>s.on),phase:'roll',dice:0,sixes:0,bonus:false,winner:-1};
}
const pcs=(S,o)=>S.pieces.filter(p=>p.o===o);
// Khóa ô: mỗi ô chỉ chứa 1 quân (trừ chuồng và ô đích)
const keyOf=(o,p)=>p<0?null:(p<RL?'r'+ringIdx(o,p):'h'+o+'_'+p);
const occ=(S,o,p,ex)=>{if(p<0||p===FIN)return null;const k=keyOf(o,p);return S.pieces.find(v=>v.id!==ex&&v.p>=0&&v.p!==FIN&&keyOf(v.o,v.p)===k)||null;};
// Kiểm tra nước đi: không đi xuyên qua quân nào (địch hay bạn), không đáp lên quân cùng phe
function moveInfo(S,pc,r){
  if(pc.p===-1){
    if(r!==1&&r!==6)return null;                          // ra quân khi tung 1 hoặc 6
    const b=occ(S,pc.o,0,pc.id);if(b&&(b.o===pc.o||b.sh))return null;
    return{to:0,exit:1};
  }
  const np=pc.p+r;if(np>FIN)return null;                  // phải đúng số bước vào đích
  for(let q=pc.p+1;q<np;q++)if(occ(S,pc.o,q,pc.id))return null;   // bị chặn đường
  const b=occ(S,pc.o,np,pc.id);
  if(b){if(b.o===pc.o)return null;if(b.sh)return{to:np,bounce:b};}   // đối thủ có giáp: bị bật lại
  return{to:np};
}
function legal(S){
  const res=[];if(S.phase!=='move')return res;
  for(const pc of pcs(S,S.turn)){if(pc.fz>0)continue;if(moveInfo(S,pc,S.dice))res.push(pc.id);}
  return res;
}
function endTurn(S,ev){
  pcs(S,S.turn).forEach(p=>{if(p.fz>0)p.fz--;});
  S.sixes=0;S.bonus=false;let n=S.turn;
  for(let g=0;g<12;g++){n=(n+1)%4;const s=S.seats[n];if(!s.on)continue;if(s.skip>0){s.skip--;ev.push({t:'skip',o:n});continue;}break;}
  S.turn=n;S.phase='roll';S.dice=0;ev.push({t:'turn',o:n});
}
function actRoll(S,rnd){
  const ev=[],r=1+Math.floor(rnd()*6);S.dice=r;ev.push({t:'roll',v:r,o:S.turn});
  S.sixes=r===6?S.sixes+1:0;
  if(S.sixes>=3){ev.push({t:'three6'});endTurn(S,ev);return ev;}
  S.phase='move';
  if(!legal(S).length){
    ev.push({t:'nomove'});
    if(r===6||r===1){S.phase='roll';S.dice=0;ev.push({t:'again',o:S.turn});}else endTurn(S,ev);
  }
  return ev;
}
function actMove(S,id,rnd){
  const ev=[],pc=S.pieces[id],r=S.dice,info=moveInfo(S,pc,r);S.bonus=(r===6||r===1);   // tung 1 hoặc 6 được đi tiếp
  if(info.exit){pc.sh=false;pc.p=0;ev.push({t:'exit',id});land(S,pc,ev,rnd,true);}
  else if(info.bounce){                                   // đáp vào quân có giáp: tiến sát rồi quay lại chỗ cũ
    const f=pc.p,stop=info.to-1;
    if(stop>f)ev.push({t:'walk',id,from:f,to:stop});
    ev.push({t:'blocked',id:info.bounce.id,by:id});
    if(stop>f)ev.push({t:'walk',id,from:stop,to:f,fast:1});
  }
  else{const f=pc.p;pc.sh=false;pc.p=info.to;ev.push({t:'walk',id,from:f,to:pc.p});land(S,pc,ev,rnd,true);}
  if(S.phase==='over')return ev;
  if(S.bonus){S.phase='roll';S.dice=0;ev.push({t:'again',o:S.turn});}else endTurn(S,ev);
  return ev;
}
// Đi từ p hiện tại về phía `to`, dừng trước quân đầu tiên cản đường (dùng cho thẻ bài / bẫy lùi)
function reach(S,pc,to){let p=pc.p;const d=to>p?1:-1;while(p!==to){const n=p+d;if(n<0||occ(S,pc.o,n,pc.id))break;p=n;}return p;}
function land(S,pc,ev,rnd,full){
  const o=pc.o,seat=S.seats[o];
  if(pc.p>=RL){
    if(pc.p===FIN){ev.push({t:'finish',id:pc.id});seat.score+=100;
      if(pcs(S,o).every(p=>p.p===FIN)){S.phase='over';S.winner=o;ev.push({t:'win',o});}}
    return;
  }
  const idx=ringIdx(o,pc.p),type=ringType(idx);
  for(const v of S.pieces){                               // đá quân đối thủ (không có giáp)
    if(v.o===o||v.p<0||v.p>=RL||ringIdx(v.o,v.p)!==idx||v===pc)continue;
    if(v.sh){ev.push({t:'blocked',id:v.id,by:pc.id});continue;}
    v.p=-1;v.fz=0;v.sh=false;seat.score+=30;ev.push({t:'capture',id:v.id,by:pc.id});
  }
  if(type==='shield'){pc.sh=true;ev.push({t:'shield',id:pc.id,start:0});}   // ô xuất phát KHÔNG còn bất tử
  if(!full)return;
  if(type==='speed'){S.bonus=true;ev.push({t:'speed',id:pc.id});}
  else if(type==='back'){
    const n=2+Math.floor(rnd()*2),to=reach(S,pc,Math.max(0,pc.p-n));
    ev.push({t:'back',id:pc.id,from:pc.p,to,n});pc.p=to;land(S,pc,ev,rnd,false);
  }
  else if(type==='mystery')drawCard(S,pc,ev,rnd);
}
function drawCard(S,pc,ev,rnd){
  const c=CARDS[Math.floor(rnd()*CARDS.length)],o=pc.o,seat=S.seats[o];
  ev.push({t:'card',id:c.id,good:c.good,o});
  switch(c.id){
    case'fwd5':{const to=reach(S,pc,Math.min(FIN,pc.p+5));if(to>pc.p){ev.push({t:'walk',id:pc.id,from:pc.p,to,fast:1});pc.p=to;land(S,pc,ev,rnd,false);}break;}
    case'revive':{const d=pcs(S,o).find(p=>p.p===-1);
      if(d&&!occ(S,o,0,d.id)){d.p=0;ev.push({t:'exit',id:d.id});land(S,d,ev,rnd,false);}
      else{seat.score+=50;ev.push({t:'coins',o,id:pc.id,n:50});}break;}
    case'coins':seat.score+=50;ev.push({t:'coins',o,id:pc.id,n:50});break;
    case'skip':seat.skip=1;S.bonus=false;ev.push({t:'skipmark',o,id:pc.id});break;
    case'reset':{const to=reach(S,pc,0);if(to<pc.p){ev.push({t:'walk',id:pc.id,from:pc.p,to,fast:1});pc.p=to;land(S,pc,ev,rnd,false);}break;}
    case'freeze':pc.fz=2;ev.push({t:'freeze',id:pc.id});break;
  }
}
// AI cho bot
function botPick(S,ids){
  let best=ids[0],bs=-1e9;
  const threat=pc=>{if(pc.p<0||pc.p>=RL||pc.sh)return false;const i0=ringIdx(pc.o,pc.p);
    return S.pieces.some(v=>{if(v.o===pc.o||v.p<0||v.p>=RL)return false;const d=(i0-ringIdx(v.o,v.p)+RL)%RL;return d>0&&d<=6;});};
  for(const id of ids){
    const pc=S.pieces[id],info=moveInfo(S,pc,S.dice);let s=Math.random()*5;
    if(info.bounce)s-=60;
    else if(pc.p===-1)s+=55;
    else{
      const np=info.to;s+=pc.p*.3;
      if(np===FIN)s+=120;else if(np>=RL)s+=45;
      else{const idx=ringIdx(pc.o,np),ty=ringType(idx);
        if(ty==='shield')s+=28;if(ty==='speed')s+=35;if(ty==='mystery')s+=8;if(ty==='back')s-=30;
        if(S.pieces.some(v=>v.o!==pc.o&&v.p>=0&&v.p<RL&&!v.sh&&ringIdx(v.o,v.p)===idx))s+=90;}
      if(threat(pc))s+=15;
    }
    if(s>bs){bs=s;best=id;}
  }
  return best;
}

/* ---------- 3. ÂM THANH (Web Audio, tự tổng hợp) ---------- */
let AC=null,muted=store.get('cl_mute',false);
function snd(type,i=0){
  if(muted)return;
  try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();}catch(e){return;}
  const now=AC.currentTime;
  const tone=(f,d,w='sine',v=.13,t0=0,to=0)=>{const o=AC.createOscillator(),g=AC.createGain();o.type=w;o.frequency.setValueAtTime(f,now+t0);
    if(to)o.frequency.exponentialRampToValueAtTime(Math.max(40,to),now+t0+d);g.gain.setValueAtTime(v,now+t0);g.gain.exponentialRampToValueAtTime(.001,now+t0+d);
    o.connect(g);g.connect(AC.destination);o.start(now+t0);o.stop(now+t0+d+.03);};
  switch(type){
    case'tick':tone(150,.08,'triangle',.14,0,70);break;
    case'hop':tone(480+i*25,.1,'sine',.12,0,820+i*25);break;
    case'roll':for(let k=0;k<10;k++)tone(180+Math.random()*260,.06,'square',.05,k*.11);break;
    case'exit':tone(500,.12,'triangle',.15,0,900);tone(900,.15,'triangle',.12,.1,1300);break;
    case'capture':tone(520,.35,'sawtooth',.14,0,90);break;
    case'shield':[880,1175,1568].forEach((f,k)=>tone(f,.18,'sine',.1,k*.07));break;
    case'speed':tone(400,.3,'square',.08,0,1600);break;
    case'back':tone(500,.4,'triangle',.14,0,120);break;
    case'whoosh':tone(300,.5,'sine',.1,0,1200);break;
    case'good':[523,659,784,1047].forEach((f,k)=>tone(f,.25,'triangle',.13,k*.09));break;
    case'bad':[400,330,262,196].forEach((f,k)=>tone(f,.25,'sawtooth',.08,k*.1));break;
    case'coin':tone(988,.08,'square',.09);tone(1319,.25,'square',.09,.08);break;
    case'freeze':[1500,1200,1800,1000].forEach((f,k)=>tone(f,.15,'sine',.1,k*.06));break;
    case'finish':[523,659,784,1047,1319].forEach((f,k)=>tone(f,.22,'triangle',.13,k*.08));break;
    case'win':[523,659,784,1047,784,1047,1319,1568].forEach((f,k)=>tone(f,.3,'triangle',.14,k*.13));break;
    case'pop':tone(700,.08,'sine',.1,0,1100);break;
  }

/* ---------- 6. HIỆU ỨNG: xúc xắc, chữ bay, vệt sáng, thẻ bài, pháo hoa ---------- */
const DICE_ROT={1:[0,0],2:[-90,0],3:[0,-90],4:[0,90],5:[90,0],6:[0,180]};
const PIPS={1:[5],2:[1,9],3:[1,5,9],4:[1,3,7,9],5:[1,3,5,7,9],6:[1,3,4,6,7,9]};
// Góc nhìn nghiêng cố định (rotateX/Y đầu) để luôn thấy 3 mặt khối; 2 rotate sau quyết định mặt kết quả
const diceT=(rx,ry,rz)=>`rotateX(-26deg) rotateY(-34deg) rotateX(${rx}deg) rotateY(${ry}deg) rotateZ(${rz}deg)`;
function buildDice(){
  const f='<div class="core c1"></div><div class="core c2"></div><div class="core c3"></div>'+[1,2,3,4,5,6].map(n=>`<div class="face f${n}">${PIPS[n].map(p=>`<i style="grid-area:${Math.ceil(p/3)}/${(p-1)%3+1}"></i>`).join('')}</div>`).join('');
  $('#cubes').innerHTML=['main','ghost g1','ghost g2'].map(c=>`<div class="cube ${c}">${f}</div>`).join('');
  diceAng.x=diceAng.y=diceAng.z=0;document.querySelectorAll('#cubes .cube').forEach(c=>c.style.transform=diceT(0,0,0));
}
/* Tung xúc xắc kiểu vật lý (Web Animations API): bay lên cao -> xoay lốc đa trục (blur) -> rơi, nảy 3 nhịp giảm dần
   trên mặt bàn (mỗi lần chạm: bẹp nhẹ + tiếng) -> lật nốt và dừng ĐÚNG mặt kết quả. Bóng đổ co/giãn theo độ cao.
   Góc quay lưu trong diceAng để lần tung sau nối tiếp liền mạch. */
const diceAng={x:0,y:0,z:0};
function rollDice(v,color){
  return new Promise(res=>{
    const cs=[...document.querySelectorAll('#cubes .cube')],sc=$('#diceScene'),box=$('#cubes'),sh=$('#dshadow');
    const[rx,ry]=DICE_ROT[v],D=2500,A=Object.assign({},diceAng);
    const fin=(a,t)=>Math.ceil((a+360*4-t)/360)*360+t;               // góc đích ≡ mặt kết quả (mod 360), quay ≥ 4 vòng
    const E={x:fin(A.x,rx),y:fin(A.y+360,ry),z:fin(A.z,0)+360};
    Object.assign(diceAng,E);sc.style.setProperty('--dc',color);snd('roll');
    // mốc thời gian: [offset, tỉ lệ quãng quay đã đi] — nhanh lúc bay, chậm dần sau mỗi lần chạm bàn
    const K=[[0,0],[.2,.42],[.42,.8],[.52,.87],[.62,.93],[.705,.965],[.79,.985],[.895,.996],[1,1]];
    const ang=(f,sk)=>diceT(A.x+(E.x-A.x)*f+sk*7,A.y+(E.y-A.y)*f,A.z+(E.z-A.z)*f);
    cs.forEach((c,i)=>{
      c.style.transform=diceT(E.x,E.y,E.z);                           // trạng thái cuối (sau khi animation kết thúc)
      const dl=i*60;
      c.animate(K.map(([o,f],j)=>({offset:o,transform:ang(f,j%2?1:-1),easing:'linear'})),{duration:D-dl,delay:dl,fill:'backwards'});
      if(i===0)c.animate([{filter:'blur(3.4px)'},{filter:'blur(2.6px)',offset:.42},{filter:'blur(1px)',offset:.62},{filter:'blur(0)',offset:.8},{filter:'blur(0)'}],{duration:D});
      else c.animate([{opacity:.34,offset:0},{opacity:.3,offset:.4},{opacity:0,offset:.68},{opacity:0}],{duration:D-dl,delay:dl,fill:'both'});
    });
    const up='cubic-bezier(.2,.7,.3,1)',dn='cubic-bezier(.55,0,.9,.55)';
    box.animate([
      {offset:0,transform:'translate(0,0) scale(1,1)',easing:up},
      {offset:.2,transform:'translate(10px,-58px) scale(1.16)',easing:dn},
      {offset:.42,transform:'translate(20px,0) scale(1.12,.84)',easing:up},
      {offset:.52,transform:'translate(16px,-30px) scale(1.02)',easing:dn},
      {offset:.62,transform:'translate(10px,0) scale(1.09,.9)',easing:up},
      {offset:.705,transform:'translate(5px,-14px) scale(1)',easing:dn},
      {offset:.79,transform:'translate(0,0) scale(1.05,.94)',easing:up},
      {offset:.895,transform:'translate(-2px,-5px) scale(1)',easing:dn},
      {offset:1,transform:'translate(0,0) scale(1,1)'}],{duration:D});
    sh.animate([
      {offset:0,transform:'translateX(0) scale(1)',opacity:.95},
      {offset:.2,transform:'translateX(10px) scale(.4)',opacity:.28},
      {offset:.42,transform:'translateX(20px) scale(1.2)',opacity:1},
      {offset:.52,transform:'translateX(16px) scale(.72)',opacity:.6},
      {offset:.62,transform:'translateX(10px) scale(1.1)',opacity:.95},
      {offset:.705,transform:'translateX(5px) scale(.86)',opacity:.75},

      {offset:.895,transform:'translateX(-2px) scale(.94)',opacity:.85},
      {offset:1,transform:'translateX(0) scale(1)',opacity:.95}],{duration:D});
    // tiếng "cộc" mỗi lần chạm bàn
    [.42,.62,.79].forEach(o=>setTimeout(()=>{try{snd('tick');}catch(e){}},D*o));
    setTimeout(res,D+40);
  });
}

const fxc=$('#fx'),fcx=fxc.getContext('2d');let fxParts=[],fxTimer=null,fxRun=false,fxActive=false;
function fxResize(){fxc.width=innerWidth;fxc.height=innerHeight;}fxResize();addEventListener('resize',fxResize);
function fxStart(){if(!fxActive){fxActive=true;requestAnimationFrame(fxLoop);}}
function burst(x,y){const hue=Math.random()*360;for(let i=0;i<80;i++){const a=Math.random()*6.283,s=1.5+Math.random()*6;
  fxParts.push({k:'s',x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,dec:.012,c:`hsl(${hue+Math.random()*50},100%,65%)`});}fxStart();}
function spark(x,y,color,n=26){for(let i=0;i<n;i++){const a=Math.random()*6.283,s=1+Math.random()*4.5;
  fxParts.push({k:'s',x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:1,dec:.028,c:color});}fxStart();}
function sparkPiece(id,color,n){const el=G.pEl[id];if(!el)return;const r=el.querySelector('.bill').getBoundingClientRect();spark(r.left+r.width/2,r.top+r.height*.55,color||'#ffd23f',n);}
function confetti(n){for(let i=0;i<n;i++)fxParts.push({k:'c',x:Math.random()*fxc.width,y:-14,vx:(Math.random()-.5)*3,vy:2+Math.random()*3,r:Math.random()*6,vr:(Math.random()-.5)*.35,w:8+Math.random()*7,h:5+Math.random()*6,life:1,c:`hsl(${Math.random()*360},90%,62%)`});fxStart();}
function fxLoop(){
  if(!fxRun&&!fxParts.length){fcx.clearRect(0,0,fxc.width,fxc.height);fxActive=false;return;}
  fcx.clearRect(0,0,fxc.width,fxc.height);
  for(const p of fxParts){
    if(p.k==='s'){p.x+=p.vx;p.y+=p.vy;p.vy+=.06;p.vx*=.985;p.life-=p.dec;fcx.globalAlpha=Math.max(0,p.life);fcx.fillStyle=p.c;fcx.beginPath();fcx.arc(p.x,p.y,2.6,0,6.283);fcx.fill();}
    else{p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;p.vx+=Math.sin(p.r)*.05;fcx.save();fcx.globalAlpha=1;fcx.translate(p.x,p.y);fcx.rotate(p.r);fcx.fillStyle=p.c;fcx.fillRect(-p.w/2,-p.h/2,p.w,p.h);fcx.restore();if(p.y>fxc.height+20)p.life=0;}
  }
  fcx.globalAlpha=1;fxParts=fxParts.filter(p=>p.life>0);requestAnimationFrame(fxLoop);
}
function startVictory(){
  fxRun=true;fxStart();confetti(120);
  fxTimer=setInterval(()=>{burst(fxc.width*(.15+Math.random()*.7),fxc.height*(.12+Math.random()*.4));confetti(14);snd('pop');},520);
}
function stopVictory(){fxRun=false;clearInterval(fxTimer);fxParts=[];}
// Nền: tia lấp lánh, bong bóng, cánh hoa
(function(){
  const c=$('#bg'),x=c.getContext('2d');let W,H;const P=[];
  const rs=()=>{W=c.width=innerWidth;H=c.height=innerHeight;};rs();addEventListener('resize',rs);
  const mk=init=>{const k=['spark','bubble','petal'][Math.floor(Math.random()*3)];
    return{k,x:Math.random()*W,y:init?Math.random()*H:(k==='petal'?-20:H+20),r:3+Math.random()*(k==='bubble'?13:7),vy:k==='petal'?.5+Math.random()*.7:-(.2+Math.random()*.6),ph:Math.random()*6.28,rot:Math.random()*6.28,h:Math.random()*360};};
  for(let i=0;i<64;i++)P.push(mk(true));
  (function draw(){
    x.clearRect(0,0,W,H);
    for(let i=0;i<P.length;i++){const p=P[i];p.y+=p.vy;p.ph+=.02;p.x+=Math.sin(p.ph)*.5;p.rot+=.012;
      if(p.y<-40||p.y>H+40){P[i]=mk(false);continue;}
      x.save();x.translate(p.x,p.y);x.rotate(p.rot);
      if(p.k==='spark'){x.globalAlpha=.45+.45*Math.sin(p.ph*3);x.fillStyle=`hsl(${p.h},100%,75%)`;const r=p.r;x.beginPath();x.moveTo(0,-r);x.quadraticCurveTo(0,0,r,0);x.quadraticCurveTo(0,0,0,r);x.quadraticCurveTo(0,0,-r,0);x.quadraticCurveTo(0,0,0,-r);x.fill();}
      else if(p.k==='bubble'){x.globalAlpha=.7;x.strokeStyle='rgba(255,255,255,.95)';x.fillStyle='rgba(190,230,255,.28)';x.lineWidth=2;x.beginPath();x.arc(0,0,p.r,0,6.28);x.fill();x.stroke();}
      else{x.globalAlpha=.75;x.fillStyle='#ffb3d1';x.beginPath();x.ellipse(0,0,p.r,p.r*.55,0,0,6.28);x.fill();}
      x.restore();}
    requestAnimationFrame(draw);
  })();
})();

async function hostAct(a,seat){
  const sid=G.sid;while(G.busy)await sleep(40);

  else if(a.t==='move'){if(S.phase!=='move'||!legal(S).includes(a.id))return;ev=actMove(S,a.id,Math.random);}
  else return;

  G.mode=mode;const L={seats:[0,1,2,3].map(i=>defSeat(i,'off'))},p=myProfile();
  if(mode==='local'){L.seats[0]={type:'human',...p};L.seats[1]=defSeat(1,'bot');}
  else{L.seats[0]={type:'human',...p};for(let i=1;i<4;i++)L.seats[i]=defSeat(i,'open');}
  G.L=L;G.mySeat=0;fixColors();
}
function showLobby(){
  const online=G.mode!=='local';
  show('lobby');$('#lobbyTitle').textContent=online?t('room'):t('lobby_local');
  $('#roomBox').style.display=online?'flex':'none';$('#roomCode').textContent=G.code;renderLobby();
}
function renderLobby(){
  if(!$('#lobby').classList.contains('active'))return;
  const w=$('#seats');w.innerHTML='';if(G.L)for(let i=0;i<4;i++)w.appendChild(seatCard(i));
  const act=G.L?G.L.seats.filter(isAct).length:0;
  $('#lobStart').style.display=G.mode==='guest'?'none':'';$('#lobStart').disabled=act<2;
  $('#lobMsg').textContent=G.mode==='guest'?t('wait_host'):(act<2?t('need2'):'');
}
function seatCard(i){
  const s=G.L.seats[i],online=G.mode!=='local',mine=online&&i===G.mySeat;
  const canType=G.mode==='local'||(G.mode==='host'&&i!==0&&s.type!=='human');
  const canLook=G.mode==='local'||mine||(G.mode==='host'&&s.type==='bot');
  const el=document.createElement('div');el.className='seat'+((s.type==='off'||s.type==='open')?' dim':'');el.dataset.i=i;el.style.setProperty('--c',areaColor(s.color));
  const opts=G.mode==='local'?['human','bot','off']:['open','bot','off'];
  let h=`<div class="sh"><b>${esc(seatName(i,G.L.seats))}</b>${mine?`<span class="tag">${t('you')}</span>`:''}${online&&i===0?`<span class="tag">${t('host')}</span>`:''}`;
  h+=canType?`<select class="typesel">${opts.map(o=>`<option value="${o}"${o===s.type?' selected':''}>${t('seat_'+o)}</option>`).join('')}</select>`:`<span class="tag">${t('seat_'+s.type)}</span>`;
  h+='</div>';
  if(s.type==='off'||s.type==='open'){el.innerHTML=h+`<div class="ph">${s.type==='open'?'⏳':'💤'}</div>`;return el;}
  h+=`<div class="prev">${catSVG(s,'n',undefined,true)}</div>`;
  if(canLook)h+=`<input class="nm" maxlength="14" placeholder="${esc(t('cat'+i))}" value="${esc(s.name||'')}"><button class="btn gold wbtn" style="font-size:16px;padding:8px 16px">${t('wardrobe')}</button>`;
  el.innerHTML=h;return el;
}
function lobbyChanged(i){
  if(G.mode==='local'){if(i===0&&G.L.seats[0].type==='human')store.set('cl_profile',pickProfile(G.L.seats[0]));}
  else if(G.mode==='guest'){const s=G.L.seats[G.mySeat];store.set('cl_profile',pickProfile(s));G.hostConn&&G.hostConn.send({t:'prof',p:pickProfile(s)});}
  else{if(i===0)store.set('cl_profile',pickProfile(G.L.seats[0]));broadcastLobby();}
}
$('#seats').addEventListener('change',e=>{
  if(!e.target.classList.contains('typesel'))return;
  const i=+e.target.closest('.seat').dataset.i;G.L.seats[i].type=e.target.value;fixColors();lobbyChanged(i);renderLobby();
});
$('#seats').addEventListener('input',e=>{
  const sc=e.target.closest('.seat');if(!sc||!e.target.classList.contains('nm'))return;
  const i=+sc.dataset.i;G.L.seats[i].name=e.target.value;lobbyChanged(i);
});
$('#seats').addEventListener('click',e=>{
  const b=e.target.closest('.wbtn');if(!b)return;const i=+b.closest('.seat').dataset.i;
  openWard(G.L.seats[i],()=>lobbyChanged(i),i);
});

/* --- Tủ đồ thời trang --- */
const W={t:null,cb:null,tab:'fur',i:-1,expr:'n'};
const TABS=[['fur','🎨'],['cloth','👕'],['hat','🎩'],['face','🕶️'],['neck','🧣']];
const VBS={cloth:'6 18 88 94',hat:'12 -18 76 66',face:'18 22 64 48',neck:'18 48 64 50'};
function openWard(target,cb,i){W.t=target;W.cb=cb;W.i=i;W.tab='fur';W.expr='n';
  $('#wName').value=target.name||'';$('#wName').placeholder=i>=0?t('cat'+i):t('name');$('#ward').classList.add('show');renderWard();}
function closeWard(){$('#ward').classList.remove('show');W.cb&&W.cb();W.t=null;W.cb=null;renderLobby();}
function wChanged(){W.cb&&W.cb();renderWard();}
function renderWard(){
  const L=W.t;if(!L)return;
  $('#wPrev').innerHTML=catSVG(L,W.expr,undefined,true);
  $('#wTabs').innerHTML=TABS.map(([k,ic])=>`<button data-tab="${k}" class="${W.tab===k?'on':''}">${ic} ${t('tab_'+k)}</button>`).join('');
  let h='';
  if(W.tab==='fur'){
    h+=`<div class="wlabel">${t('fur_color')}</div><div class="pal">`+PAL_FUR.map(c=>`<button data-col="${c}" class="${colorTaken(W.i,c)?'taken':''}${L.color===c?' sel':''}" style="background:${c}"></button>`).join('')+`<input type="color" id="wCustom" value="${L.color}"></div>`;
  }else{
    const n={cloth:CLOTH_N,hat:HAT_N,face:FACE_N,neck:NECK_N}[W.tab];
    if(W.tab==='cloth')h+=`<div class="wlabel">${t('cloth_color')}</div><div class="pal">`+PAL_CLO.map(c=>`<button data-cc="${c}" class="${L.ccol===c?'sel':''}" style="background:${c}"></button>`).join('')+`<input type="color" id="wCustomC" value="${L.ccol}"></div>`;
    h+='<div class="wgrid">';
    for(let k=0;k<n;k++){const v={...L,[W.tab]:k};h+=`<button data-item="${k}" class="${L[W.tab]===k?'sel':''}" title="${esc(tl(W.tab,k))}">${catSVG(v,'n',VBS[W.tab],true)}<small>${esc(tl(W.tab,k))}</small></button>`;}
    h+='</div>';
  }
  $('#wBody').innerHTML=h;
}
$('#ward').addEventListener('click',e=>{
  if(!W.t)return;const L=W.t;
  if(e.target.closest('#wStage')){W.expr='h';renderWard();snd('pop');setTimeout(()=>{W.expr='n';if(W.t)renderWard();},900);return;}
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.tab){W.tab=b.dataset.tab;renderWard();snd('pop');}
  else if(b.dataset.col){if(b.classList.contains('taken')){toast(t('color_taken'),1200);return;}L.color=b.dataset.col;snd('pop');wChanged();}
  else if(b.dataset.cc){L.ccol=b.dataset.cc;snd('pop');wChanged();}
  else if(b.dataset.item!==undefined){L[W.tab]=+b.dataset.item;snd('pop');wChanged();}
});
$('#ward').addEventListener('input',e=>{
  if(!W.t)return;const L=W.t;
  if(e.target.id==='wCustom'){if(colorTaken(W.i,e.target.value)){e.target.value=L.color;toast(t('color_taken'),1200);return;}L.color=e.target.value.toLowerCase();W.cb&&W.cb();$('#wPrev').innerHTML=catSVG(L,W.expr,undefined,true);}
  else if(e.target.id==='wCustomC'){L.ccol=e.target.value.toLowerCase();W.cb&&W.cb();$('#wPrev').innerHTML=catSVG(L,W.expr,undefined,true);}
  else if(e.target.id==='wName'){L.name=e.target.value;W.cb&&W.cb();}
});
$('#wRand').onclick=()=>{if(!W.t)return;const L=W.t,r=n=>Math.floor(Math.random()*n);
  const free=PAL_FUR.filter(c=>!colorTaken(W.i,c));if(free.length)L.color=free[r(free.length)];
  L.cloth=r(CLOTH_N);L.ccol=PAL_CLO[r(PAL_CLO.length)];L.hat=r(HAT_N);L.face=r(FACE_N);L.neck=r(NECK_N);snd('good');wChanged();};
$('#wDone').onclick=closeWard;
(function(){ // hộp trưng bày nghiêng 3D theo con trỏ
  const g=$('#cGlass'),box=$('#cBox');
  box.addEventListener('pointermove',e=>{const r=g.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;g.style.setProperty('--ty',(x*14).toFixed(1)+'deg');g.style.setProperty('--tx',(-y*10).toFixed(1)+'deg');});
  box.addEventListener('pointerleave',()=>{g.style.setProperty('--ty','0deg');g.style.setProperty('--tx','0deg');});
})();
$('#bWard').onclick=()=>{const P=myProfile();openWard(P,()=>store.set('cl_profile',P),-1);snd('pop');};

/* --- Bắt đầu / vào ván --- */
function startGame(){
  const cfg=G.L.seats.map(s=>({...s,type:isAct(s)?s.type:'off'}));
  if(cfg.filter(s=>s.type!=='off').length<2)return;
  S=newGame(cfg);
  if(G.mode==='host'){G.started=true;broadcast({t:'start',S});}
  enterGame();
}
function enterGame(){
  G.sid++;stopVictory();$('#winModal').classList.remove('show');$('#cardModal').classList.remove('show');$('#confirm').classList.remove('show');G.winShown=false;
  G.busy=false;G.waiting=false;clearTimeout(G.timer);G.started=true;
  G.vp=S.pieces.map(p=>({...p}));G.vturn=S.turn;
  show('game');buildBoard();buildPieces();buildDice();buildLegend();$('#log').innerHTML='';
  CAM.zoom=1;layout();setView(VIEWS[G.viewMode]?G.viewMode:'iso');refreshHUD();afterUpdate();
}
function exitToMenu(){ // thoát an toàn: huỷ mọi animation/timer đang chạy, đóng mọi hộp thoại
  G.sid++;G.mode='menu';G.started=false;clearTimeout(G.timer);stopVictory();
  try{G.peer&&G.peer.destroy();}catch(e){}
  G.peer=null;G.conns={};G.hostConn=null;G.busy=false;G.waiting=false;S=null;G.L=null;G.q=Promise.resolve();
  ['winModal','cardModal','confirm'].forEach(id=>$('#'+id).classList.remove('show'));$('#ward').classList.remove('show');
  show('menu');
}
function askHome(){if(S&&G.mode!=='menu'&&S.phase!=='over')$('#confirm').classList.add('show');else exitToMenu();}

/* --- Online: WebRTC peer-to-peer qua PeerJS (mã phòng = ID chủ phòng) --- */
function loadPeerLib(){return new Promise((res,rej)=>{if(window.Peer)return res();const s=document.createElement('script');s.src='https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js';s.onload=res;s.onerror=()=>rej();document.head.appendChild(s);});}
const genCode=()=>{const a='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let c='';for(let i=0;i<5;i++)c+=a[Math.floor(Math.random()*a.length)];return c;};
function broadcast(m){for(const k in G.conns){const c=G.conns[k];try{if(c&&c.open)c.send(m);}catch(e){}}}
function broadcastLobby(){broadcast({t:'lobby',seats:G.L.seats});renderLobby();}
async function createRoom(){
  toast(t('connecting'),6000);
  try{await loadPeerLib();}catch(e){toast(t('err_peer'));return;}
  initLobby('host');openPeer(0);
}
function openPeer(tries){
  const code=genCode(),peer=new Peer('catludo-'+code);G.peer=peer;
  peer.on('open',()=>{G.code=code;$('#toast').classList.remove('show');showLobby();});
  peer.on('connection',onGuestConn);
  peer.on('error',err=>{
    if(err.type==='unavailable-id'&&tries<5){try{peer.destroy();}catch(e){}openPeer(tries+1);}
    else{toast(t('err_peer')+' ('+err.type+')',3500);exitToMenu();}
  });
}
function onGuestConn(conn){
  conn.on('data',m=>{
    if(!m||!m.t)return;
    if(m.t==='hello'){
      if(G.started){conn.send({t:'err',msg:'err_full'});setTimeout(()=>conn.close(),300);return;}
      const i=G.L.seats.findIndex(s=>s.type==='open');
      if(i<0){conn.send({t:'err',msg:'err_full'});setTimeout(()=>conn.close(),300);return;}
      const p=m.p||{};G.L.seats[i]={type:'human',name:String(p.name||'').slice(0,14),...cleanLook(p,i)};fixColors();
      G.conns[i]=conn;conn._seat=i;conn.send({t:'welcome',seat:i});broadcastLobby();
    }else if(m.t==='prof'&&conn._seat!==undefined&&!G.started){
      const p=m.p||{},s=G.L.seats[conn._seat],c=cleanLook(p,conn._seat);
      s.name=String(p.name||'').slice(0,14);if(colorTaken(conn._seat,c.color))c.color=s.color;Object.assign(s,c);broadcastLobby();
    }else if(m.t==='rename'&&conn._seat!==undefined&&G.started&&S){applyName(conn._seat,m.name);broadcast({t:'name',seat:conn._seat,name:S.seats[conn._seat].name});}
    else if((m.t==='roll'||m.t==='move')&&conn._seat!==undefined&&G.started){hostAct(m,conn._seat);}
  });
  conn.on('close',()=>{
    const i=conn._seat;if(i===undefined)return;delete G.conns[i];
    if(G.started&&S){S.seats[i].type='bot';toast(seatName(i,S.seats)+' → '+t('seat_bot'));refreshHUD();autoplay();}
    else if(G.L){G.L.seats[i]=defSeat(i,'open');broadcastLobby();}
  });
}
async function joinRoom(){
  const code=$('#joinCode').value.trim().toUpperCase();if(code.length<4)return;
  toast(t('connecting'),9000);
  try{await loadPeerLib();}catch(e){toast(t('err_peer'));return;}
  G.mode='guest';G.code=code;G.L=null;G.started=false;
  const peer=new Peer();G.peer=peer;
  peer.on('open',()=>{
    const conn=peer.connect('catludo-'+code,{serialization:'json',reliable:true});G.hostConn=conn;let opened=false;
    conn.on('open',()=>{opened=true;conn.send({t:'hello',p:myProfile()});$('#toast').classList.remove('show');showLobby();});
    conn.on('data',onHostMsg);
    conn.on('close',()=>{if(G.mode==='guest'){toast(t('err_left'),3000);exitToMenu();}});
    setTimeout(()=>{if(!opened&&G.mode==='guest'){toast(t('err_room'),3000);exitToMenu();}},10000);
  });
  peer.on('error',err=>{toast(err.type==='peer-unavailable'?t('err_room'):t('err_peer'),3000);exitToMenu();});
}
function onHostMsg(m){
  if(!m||!m.t)return;
  if(m.t==='welcome')G.mySeat=m.seat;
  else if(m.t==='lobby'){G.L={seats:m.seats};if(!$('#lobby').classList.contains('active')&&!G.started&&!W.t)showLobby();else renderLobby();}
  else if(m.t==='start'){S=m.S;G.started=true;enterGame();}
  else if(m.t==='upd'){
    const sid=G.sid;
    G.q=G.q.then(async()=>{if(!S||sid!==G.sid)return;G.busy=true;S=m.S;markMovable();refreshHUD();await playEvents(m.ev,sid);if(sid!==G.sid)return;G.busy=false;afterUpdate();});
  }
  else if(m.t==='name'){if(S)applyName(m.seat,m.name);}
  else if(m.t==='err'){toast(t(m.msg),3000);exitToMenu();}
}

/* --- Nút bấm chung --- */
$('#bLocal').onclick=()=>{initLobby('local');G.code='';showLobby();snd('pop');};
$('#bCreate').onclick=createRoom;$('#bJoin').onclick=joinRoom;
$('#joinCode').addEventListener('keydown',e=>{if(e.key==='Enter')joinRoom();});
$('#lobBack').onclick=exitToMenu;$('#lobStart').onclick=startGame;
$('#copyBtn').onclick=()=>{try{navigator.clipboard.writeText(G.code);}catch(e){}toast(t('copied'),1200);};
$('#rollBtn').onclick=onRoll;$('#diceScene').onclick=onRoll;
$('#homeBtn').onclick=askHome;
$('#cStay').onclick=()=>$('#confirm').classList.remove('show');
$('#cLeave').onclick=exitToMenu;
addEventListener('keydown',e=>{if(e.key==='Escape'){if($('#confirm').classList.contains('show'))$('#confirm').classList.remove('show');else if($('#ward').classList.contains('show'))closeWard();}});
$('#winMenu').onclick=exitToMenu;
$('#againBtn').onclick=()=>{if(G.mode==='guest')return;S=newGame(S.seats.map(s=>({...s,type:s.type})));if(G.mode==='host')broadcast({t:'start',S});enterGame();};
$('#sndBtn').onclick=()=>{muted=!muted;store.set('cl_mute',muted);$('#sndBtn').textContent=muted?'🔇':'🔊';snd('pop');};
$('#langSel').onchange=e=>{lang=e.target.value;store.set('cl_lang',lang);applyLang();};

function applyLang(){
  document.documentElement.lang=lang;$('#langSel').value=lang;$('#sndBtn').textContent=muted?'🔇':'🔊';
  document.querySelectorAll('[data-i]').forEach(e=>e.textContent=t(e.dataset.i));
  document.querySelectorAll('[data-ph]').forEach(e=>e.placeholder=t(e.dataset.ph));
  $('#rulesBody').innerHTML='<ul>'+I18N[lang].rules.map(r=>`<li>${r}</li>`).join('')+'</ul>';
  document.title=t('title');updViewLabel();
  if($('#lobby').classList.contains('active'))renderLobby();
  if(W.t)renderWard();
  if(S&&G.mode!=='menu'){buildLegend();refreshHUD();}
}
$('#logoCats').innerHTML=[0,1,2,3].map(i=>catSVG(DEFL[i],i%2?'h':'n',undefined,true)).join('');
applyLang();
</script>
